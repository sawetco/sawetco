version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
