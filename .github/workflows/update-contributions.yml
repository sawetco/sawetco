name: GitHub katkılarını güncelle

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: read

concurrency:
  group: update-github-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js kur
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Katkıları güncelle
        run: node scripts/update-github-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sawetco

      - name: README katkı istatistiklerini üret
        run: node scripts/render-readme-stats.mjs

      - name: Create or refresh the tested contribution pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/github-contributions.json .github/readme-stats.svg; then exit 0; fi
          branch=automation/contributions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add data/github-contributions.json .github/readme-stats.svg
          git commit -m 'chore: update contributions and readme stats'
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$remote" origin "HEAD:refs/heads/$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --head "$branch" --base main --title 'chore: update contributions and readme stats' --body 'Generated contribution assets. Merged automatically only after source and security checks pass.'
          fi
          gh label create automation:contributions --color 1d76db --force
          gh pr edit "$branch" --add-label automation:contributions
          gh workflow run quality.yml --ref "$branch"
          gh workflow run security.yml --ref "$branch"
          gh workflow run codeql.yml --ref "$branch"
