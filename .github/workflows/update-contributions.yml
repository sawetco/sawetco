name: GitHub katkılarını güncelle

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js kur
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Katkıları güncelle
        run: node scripts/update-github-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sawetco

      - name: README katkı istatistiklerini üret
        run: node scripts/render-readme-stats.mjs

      - name: Değişiklik varsa commit et
        shell: bash
        run: |
          if git diff --quiet -- data/github-contributions.json .github/readme-stats.svg; then
            echo "Katkı verisinde değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json .github/readme-stats.svg
          git commit -m "chore: update contributions and readme stats"
          # GitHub tarafındaki geçici push/commit_refs hatalarında yeniden dene.
          # Kalıcı yetki veya branch koruma hatalarını gizleme.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Katkı verisi main dalına gönderildi."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::GitHub push işlemi 3 denemede başarısız oldu."
              exit 1
            fi

            echo "::warning::Push başarısız (deneme $attempt/3); yeniden denenecek."
            sleep $((attempt * 15))
          done
