name: Temporary security lockfile refresh
on:
  push:
    branches:
      - fix/security-hono-2026-10-22
    paths:
      - 'pnpm-workspace.yaml'
      - '.github/workflows/security-lockfile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile with pnpm
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Validate lockfile is frozen-installable
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): regenerate secure pnpm lockfile"
            git push origin HEAD:fix/security-hono-2026-10-22
          fi
