name: Quality

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - data/github-contributions.json

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm kur
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: pnpm store yolunu bul
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: pnpm store önbelleğini yükle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Güvenlik denetimi
        run: pnpm audit

      - name: Kod kalitesini denetle
        run: pnpm lint

      - name: Tipleri denetle
        run: pnpm typecheck

      - name: Üretim derlemesini doğrula
        run: pnpm build
