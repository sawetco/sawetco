name: Refresh dependency lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/minor-and-patch-01d9b23f9b

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dependabot/npm_and_yarn/minor-and-patch-01d9b23f9b
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm kur
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Lockfile güncelle
        run: pnpm install --no-frozen-lockfile

      - name: Güvenlik denetimi
        run: pnpm audit

      - name: Lockfile değişikliğini kaydet
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): refresh security override lockfile"
          git push origin HEAD:dependabot/npm_and_yarn/minor-and-patch-01d9b23f9b
