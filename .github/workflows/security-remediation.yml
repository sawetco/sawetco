name: Security remediation

on:
  push:
    branches:
      - dependabot/npm_and_yarn/minor-and-patch-6b4d1cd3c1

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm kur
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Güvenlik ve metadata düzeltmelerini uygula
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const workspacePath = 'pnpm-workspace.yaml';
          const workspace = fs.readFileSync(workspacePath, 'utf8');
          if (!workspace.includes('fast-uri: 3.1.5')) {
            throw new Error('Beklenen fast-uri 3.1.5 override bulunamadı.');
          }
          fs.writeFileSync(
            workspacePath,
            workspace.replace('fast-uri: 3.1.5', 'fast-uri: 3.1.7'),
          );

          const layoutPath = 'app/layout.tsx';
          const layout = fs.readFileSync(layoutPath, 'utf8');
          const oldTemplate = 'template: `%s — ${siteConfig.name}`,';
          const newTemplate = 'template: `%s - ${siteConfig.name}`,';
          if (!layout.includes(oldTemplate)) {
            throw new Error('Beklenen metadata title template bulunamadı.');
          }
          fs.writeFileSync(layoutPath, layout.replace(oldTemplate, newTemplate));
          NODE

      - name: Lockfile güncelle
        run: pnpm install --lockfile-only

      - name: Bağımlılıkları doğrula
        run: pnpm install --frozen-lockfile

      - name: Güvenlik denetimi
        run: pnpm audit

      - name: Kod kalitesini denetle
        run: pnpm lint

      - name: Tipleri denetle
        run: pnpm typecheck

      - name: Üretim derlemesini doğrula
        run: pnpm build

      - name: Düzeltmeleri dala gönder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml app/layout.tsx
          git commit -m "fix(deps): remediate fast-uri vulnerabilities"
          git push origin "HEAD:${{ github.ref_name }}"
